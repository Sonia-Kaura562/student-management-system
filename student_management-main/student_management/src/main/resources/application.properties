# Database configuration:
# Uses external database (like MySQL) if SPRING_DATASOURCE_URL is provided.
# Otherwise, defaults to persistent embedded H2 file database (zero configuration required on Render!).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

server.port=${PORT:8080}
spring.application.name=student_management